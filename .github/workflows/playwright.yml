name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers (chromium only — faster CI)
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 5. Run tests
      #    Secrets are stored in GitHub → Settings → Secrets and variables → Actions
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL:  ${{ secrets.BASE_URL }}
          USERNAME:  ${{ secrets.USERNAME }}
          PASSWORD:  ${{ secrets.PASSWORD }}

      # 6. Upload HTML report (always, even on failure)
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      # 7. Upload screenshots and videos (only on failure)
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            allure-results/
          retention-days: 7